experiments:
  - name: "Routing_grid"
    type: routing
    num_samples: 1000
    backends: ["custom_grid"]
    backends_sizes: [289]
    codes: ["surface", "hh", "gross", "color", "bacon", "steane"]
    routing_methods: ["basic", "sabre", "stochastic"]
    layout_methods: ["dense", "trivial", "sabre"]
  - name: "Routing_hh"
    type: routing
    num_samples: 1000
    backends: ["custom_heavyhex"]
    backends_sizes: [290]
    codes: ["surface", "hh", "gross", "color", "bacon", "steane"]
    routing_methods: ["basic", "sabre", "stochastic"]
    layout_methods: ["dense", "trivial", "sabre"]
  # Placed without SWAPs where the device allows it (no layout method), else as SABRE places it
  - name: "Routing_grid_placed"
    type: routing
    num_samples: 100
    backends: ["custom_grid"]
    backends_sizes: [289]
    codes: ["surface", "hh", "color", "bacon", "steane"]
    routing_methods: ["basic", "sabre", "stochastic"]
    layout_methods: [null]
  - name: "Routing_hh_placed"
    type: routing
    num_samples: 100
    backends: ["custom_heavyhex"]
    backends_sizes: [290]
    codes: ["surface", "hh", "color", "bacon", "steane"]
    routing_methods: ["basic", "sabre", "stochastic"]
    layout_methods: [null]
  # A grid in the shape of a diamond, as Willow's, into which the surface code fits
  - name: "Routing_diamond"
    type: routing
    num_samples: 100
    backends: ["custom_diamond"]
    backends_sizes: [313]
    codes: ["surface", "hh", "color", "bacon", "steane"]
    routing_methods: ["basic", "sabre", "stochastic"]
    layout_methods: [null, "sabre"]
